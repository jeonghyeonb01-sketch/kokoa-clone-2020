<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="css/styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friends - Kokoa Clone</title>
</head>
<body>
    <div class="status-bar">
        <div class="status-bar__column">
            <span>No Service</span>
            <i class="fa-solid fa-wifi"></i>
        </div>
        <div class="status-bar__column">
            <span>18:43</span>
        </div>
        <div class="status-bar__column">
            <span>110%</span>
            <i class="fa-solid fa-battery-full fa-lg"></i>
            <i class="fa-solid fa-bolt-lightning"></i>
        </div>
    </div>

    <header class="screen-header">
        <h1 class="screen-header__title">Friends</h1>
        <div class="screen-header__icons">
            <span><i class="fa-solid fa-magnifying-glass fa-2x"></i></span>
            <span><i class="fa-solid fa-music fa-2x"></i></span>  
            <span><i class="fa-solid fa-gear fa-2x"></i></span>                
        </div>
    </header>

    <a id="friends-display-link">
        <i class="fa-solid fa-circle-info"></i> Friends' Names Display
        <i class="fa-solid fa-chevron-right fa-xs"></i>
    </a>

<main class="friends-screen">
    <div class="user-component">
        <div class="user-component__column">
            <img
                src="https://avatars3.githubusercontent.com/u/3612017"
                class="user-component__avatar user-component__avatar--xl"
            /> 
            <div class="user-component__text">
                <h4 class="user-component__title">Nicolas</h4>
                <!-- <h5 class="user-component__subtitle">this text whatever</h5> -->
            </div>    
        </div>
    <div class="user-component__column"></div>
    </div>
    <div class="friends-screen__channel">
        <div class="friends-screen__channel-header">
            <span>Channel</span>
            <i class="fa-solid fa-chevron-up"></i>
        </div>
            <div class="user-component">
        <div class="user-component__column">
            <img
                src="https://avatars3.githubusercontent.com/u/3612017"
                class="user-component__avatar user-component__avatar--sm"
            /> 
            <div class="user-component__text">
                <h4 class="user-component__title user-component__title--not-bold">Channel</h4>
            </div>    
        </div>
        <div class="user-component__column">
            <div>
            <span>2</span>
            <i class="fa-solid fa-chevron-right fa-xs"></i>
            </div>
        </div>
    </div>
    </div>
</main>



    
    <nav class="nav">
        <ul class="nav__list">
            <li class="nav__btn">
                <a class="nav__link" href="friends.html">
                    <i class="fas fa-user fa-2x"></i>
                </a></li>
            <li class="nav__btn">
                <a class="nav__link" href="chats.html">
                    <span class="nav__notification badge">1</span>
                    <i class="fa-regular fa-message fa-2x"></i></a></li>
                
            <li class="nav__btn">
                <a class="nav__link" href="find.html">
                    <i class="fa-solid fa-magnifying-glass fa-2x"></i>
                </a></li>
            <li class="nav__btn">
                <a class="nav__link" href="more.html">
                    <span class="nav__dot"></span>
                    <i class="fa-solid fa-ellipsis fa-2x"></i>
                </a></li>
        </ul>
    </nav>
    
    <div id="splash-screen">
        <i class="fa-regular fa-message"></i>
    </div>

    <div id="no-mobile">
        <span>Your screen is too big ㅠㅠ</span>
    </div>

    <script src="https://kit.fontawesome.com/d8d9aea080.js" crossorigin="anonymous"></script>
</body>
</html>
